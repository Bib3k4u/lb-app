<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light only"><meta name="supported-color-schemes" content="light only">
<title>@TITLE_TEXT@</title></head>
<body style="margin:0;padding:0;background:#ffffff;font-family:Arial,Helvetica,sans-serif;color:#0a0a0a;-webkit-text-size-adjust:100%">
<div style="display:none;max-height:0;overflow:hidden;opacity:0">@PREHEADER@</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%">

<!-- HERO: full-bleed black -->
<tr><td bgcolor="#0a0a0a" align="center" style="background:#0a0a0a;background-image:linear-gradient(150deg,#332c08 0%,#0a0a0a 58%)">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px">
<tr><td style="padding:22px 24px 0">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
<td align="left" valign="middle">
<table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
<td bgcolor="#f6dc3c" align="center" width="34" height="34" style="background:#f6dc3c;border-radius:9px;font-family:'Arial Narrow',Arial,sans-serif;font-weight:800;font-size:16px;color:#0a0a0a">NG</td>
<td style="padding-left:10px;font-family:'Arial Narrow',Arial,sans-serif;font-weight:800;font-size:19px;letter-spacing:.06em;color:#ffffff;line-height:1">LIMIT<span style="color:#f6dc3c">BEYOND</span><br><span style="font-size:8px;letter-spacing:.2em;color:#bdbcb0;font-weight:700">BY NEELKANTH GYM</span></td>
</tr></table></td>
<td align="right" valign="middle"><img src="@LOGO_DARK@" alt="Neelkanth Gym" width="92" style="display:block;width:92px;height:auto;margin-left:auto"></td>
</tr></table></td></tr>
<tr><td style="padding:30px 24px 34px">
<p style="margin:0;font-size:11px;font-weight:800;letter-spacing:.2em;color:#f6dc3c">@EYEBROW@</p>
<p style="margin:12px 0 0;font-family:'Arial Narrow',Arial,sans-serif;font-weight:800;font-size:38px;line-height:1.02;color:#ffffff;text-transform:uppercase">@TITLE_HTML@</p>
<p style="margin:16px 0 0;font-size:15px;line-height:1.6;color:#e2e1d6">@INTRO@</p>
</td></tr>
</table></td></tr>

<!-- band -->
<tr><td bgcolor="#f6dc3c" align="center" style="background:#f6dc3c;padding:9px 12px;font-family:'Arial Narrow',Arial,sans-serif;font-weight:800;font-size:11px;letter-spacing:.1em;line-height:1.7;color:#0a0a0a">ROSTER &#9889; PLANS &#9889; BILLING &#9889; ATTENDANCE &#9889; FEEDBACK</td></tr>

<!-- BODY: full-width white -->
<tr><td bgcolor="#ffffff" align="center" style="background:#ffffff">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px">
<tr><td style="padding:30px 24px 8px;font-size:15px;line-height:1.6;color:#33332d">@BODY@</td></tr>
@BUTTONS@
</table></td></tr>

<!-- sign-off -->
<tr><td bgcolor="#faf9f2" align="center" style="background:#faf9f2;border-top:1px solid #ece9da">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px"><tr><td style="padding:20px 24px;font-size:14px;line-height:1.6;color:#33332d">@SIGNOFF@</td></tr></table></td></tr>

<!-- footer -->
<tr><td bgcolor="#0a0a0a" align="center" style="background:#0a0a0a">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px"><tr><td align="center" style="padding:22px 24px;font-size:12px;line-height:1.7;color:#a9a89c">
<span style="color:#ffffff;font-weight:700">LimitBeyond by Neelkanth Gym</span><br>Laxmi Nagar &amp; Madhu Vihar, Delhi &middot; <a href="https://neelkanthgym.in" style="color:#f6dc3c;text-decoration:none;font-weight:700">neelkanthgym.in</a><br>
<span style="font-size:11px;color:#8a897d">@FOOTNOTE@</span>
</td></tr></table></td></tr>

</table></body></html>
